<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ONE · 페이지를 찾을 수 없어요</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f5ef;color:#191a19;
      font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;text-align:center;padding:24px;word-break:keep-all}
    .logo{font-family:Didot,Georgia,serif;font-size:34px;margin-bottom:18px}
    p{color:#646760;margin:8px 0 26px}
    a{display:inline-block;padding:13px 22px;border-radius:12px;background:#191a19;color:#fff;text-decoration:none;font-weight:600}
  </style>
</head>
<body>
  <main>
    <div class="logo">ONE</div>
    <h1 style="font-size:21px;margin:0">페이지를 찾을 수 없어요</h1>
    <p>주소가 바뀌었거나 삭제된 페이지입니다.</p>
    <a id="home" href="/">컬렉션 보기</a>
  </main>
  <script>
    // GitHub Pages 프로젝트 사이트(/저장소명/)에서도 컬렉션으로 돌아가게 한다.
    var seg = location.pathname.split('/').filter(Boolean);
    if (/\.github\.io$/.test(location.hostname) && seg.length) document.getElementById('home').href = '/' + seg[0] + '/';
  </script>
</body>
</html>
